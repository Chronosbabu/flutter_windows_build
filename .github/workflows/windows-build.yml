name: Windows Build Only

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Rename executable
        shell: powershell
        run: |
          Rename-Item `
            "build\windows\x64\runner\Release\c_schollapp.exe" `
            "EDUPAY-DRC.exe"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Compile installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup Compiler introuvable : $iscc"
            exit 1
          }

          & $iscc "installer.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "La compilation Inno Setup a échoué."
            exit $LASTEXITCODE
          }

      - name: Verify installer
        shell: powershell
        run: |
          if (!(Test-Path "EDUPAY-DRC-Setup.exe")) {
            Write-Error "EDUPAY-DRC-Setup.exe n'a pas été créé."
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EDUPAY-DRC-Setup
          path: EDUPAY-DRC-Setup.exe
          if-no-files-found: error